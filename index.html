<title>FFc Fútbol 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#0a2e12;--fg:#fff;--accent:#22c55e;--blue:#2563eb;--red:#dc2626;--hud:#1a1a2e;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071a0c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#071a0c;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas#game{display:block;position:fixed;inset:0;width:100%;height:100%}

/* ── HUD top bar ── */
#hud{
  position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:0;
  background:linear-gradient(180deg,rgba(10,10,30,.92) 70%,transparent);
  padding:6px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));
  pointer-events:none;z-index:6;
}
.team-block{display:flex;align-items:center;gap:7px;min-width:130px}
.team-block.right{flex-direction:row-reverse}
.crest{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:17px;flex-shrink:0}
.crest-blue{background:var(--blue)}
.crest-red{background:var(--red)}
.team-name{font-size:12px;font-weight:800;letter-spacing:.5px;opacity:.9}
.score-box{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:10px;padding:4px 14px;margin:0 8px;
}
.score{font-size:30px;font-weight:900;letter-spacing:2px;font-variant-numeric:tabular-nums}
.score-sep{font-size:22px;opacity:.4;font-weight:300;margin:0 2px}
#timer{font-size:11px;font-weight:700;letter-spacing:1px;opacity:.75;text-align:center;margin-top:1px}

/* ── portrait warning ── */
#rotate-msg{display:none;position:fixed;inset:0;z-index:100;place-items:center;background:#0a2e12;color:#fff;font-size:20px;font-weight:800;text-align:center;flex-direction:column;gap:10px}
#rotate-msg span{font-size:50px;display:block;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px)and(orientation:portrait){#rotate-msg{display:grid!important}}

/* ── controls overlay ── */
#controls{position:fixed;inset:0;pointer-events:none;z-index:5}

/* joystick */
#stick{
  position:absolute;
  left:max(20px,env(safe-area-inset-left,0px));
  bottom:calc(24px + env(safe-area-inset-bottom,0px));
  width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);
  pointer-events:auto;touch-action:none;
}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.4)}

/* action buttons — A B C like eFootball */
.abtn{
  position:absolute;pointer-events:auto;touch-action:none;
  border-radius:50%;display:grid;place-items:center;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.28);backdrop-filter:blur(6px);
  font-weight:900;color:rgba(255,255,255,.85);
  transition:transform .07s,filter .07s;
  flex-direction:column;text-align:center;
}
.abtn:active,.abtn.on{transform:scale(.88);filter:brightness(1.5)}

#bA{  /* DISPARO FUERTE */
  width:72px;height:72px;font-size:22px;
  right:max(18px,env(safe-area-inset-right,0px));
  bottom:calc(28px + env(safe-area-inset-bottom,0px));
  background:rgba(220,38,38,.35);border-color:rgba(220,38,38,.6);
}
#bB{  /* CHUTE RASO */
  width:68px;height:68px;font-size:20px;
  right:calc(102px + env(safe-area-inset-right,0px));
  bottom:calc(68px + env(safe-area-inset-bottom,0px));
  background:rgba(37,99,235,.35);border-color:rgba(37,99,235,.6);
}
#bC{  /* CHUTE ELEVADO */
  width:62px;height:62px;font-size:18px;
  right:calc(178px + env(safe-area-inset-right,0px));
  bottom:calc(108px + env(safe-area-inset-bottom,0px));
  background:rgba(34,197,94,.35);border-color:rgba(34,197,94,.6);
}
#bSwitch{
  width:52px;height:52px;font-size:9px;font-weight:700;
  right:calc(180px + env(safe-area-inset-right,0px));
  bottom:calc(28px + env(safe-area-inset-bottom,0px));
  background:rgba(168,85,247,.35);border-color:rgba(168,85,247,.6);
}
#bRun{
  width:52px;height:52px;font-size:9px;font-weight:700;
  right:calc(108px + env(safe-area-inset-right,0px));
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:rgba(234,179,8,.35);border-color:rgba(234,179,8,.6);
}
.abtn-label{font-size:8px;font-weight:700;letter-spacing:.5px;opacity:.7;margin-top:1px;line-height:1}

/* ── minimap ── */
#minimap{
  position:fixed;
  left:50%;transform:translateX(-50%);
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:110px;height:70px;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);
  border-radius:6px;overflow:hidden;pointer-events:none;z-index:5;
}

/* ── message overlay ── */
#msg{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.65);text-align:center;z-index:10}
#msg .box{padding:28px 30px}
#msg h1{font-size:36px;margin:0 0 6px}
#msg p{font-size:14px;opacity:.8;margin:0 0 18px}
#msg button{font-size:17px;font-weight:800;padding:12px 28px;border:none;border-radius:12px;background:var(--accent);color:#052e13;cursor:pointer;touch-action:manipulation}

/* ── hint ── */
#hint{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);opacity:.35;font-size:9px;pointer-events:none;white-space:nowrap}
</style>

<div id="rotate-msg"><span>📱</span>Gira el teléfono<br>modo horizontal</div>
<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="team-block">
    <div class="crest crest-blue">⚽</div>
    <div class="team-name">TÚ</div>
  </div>
  <div class="score-box">
    <span class="score" id="sMe">0</span>
    <span class="score-sep">-</span>
    <span class="score" id="sCpu">0</span>
  </div>
  <div class="team-block right">
    <div class="crest crest-red">🤖</div>
    <div class="team-name">CPU</div>
  </div>
</div>
<div style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 46px);left:0;right:0;text-align:center;pointer-events:none;z-index:6">
  <div id="timer" style="display:inline-block;background:rgba(0,0,0,.5);border-radius:10px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:1px">02:30</div>
</div>

<!-- Controls -->
<div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <div class="abtn" id="bA"><span>A</span><div class="abtn-label">FUERTE</div></div>
  <div class="abtn" id="bB"><span>B</span><div class="abtn-label">RASO</div></div>
  <div class="abtn" id="bC"><span>C</span><div class="abtn-label">ELEVADO</div></div>
  <div class="abtn" id="bSwitch">CAMBIAR</div>
  <div class="abtn" id="bRun">CORRER</div>
</div>

<canvas id="minimap"></canvas>

<div id="msg"><div class="box"><h1 id="msgT">⚽ FFc</h1><p id="msgP">Player vs CPU · 5v5</p><button id="btnStart">JUGAR</button></div></div>
<div id="hint">WASD/joystick mover · A disparo · B pase raso · C elevado · Q cambiar · Shift correr</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function(){
"use strict";
const THREE=window.THREE;

const FIELD_W=52,FIELD_L=100,GOAL_W=16,WALL=1;
const HALF_W=FIELD_W/2,HALF_L=FIELD_L/2,BALL_R=0.55,P_RADIUS=0.85,TEAM_SIZE=5,MATCH_TIME=150;

const canvas=document.getElementById("game");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a2e12);
scene.fog=new THREE.Fog(0x0a2e12,90,180);
const camera=new THREE.PerspectiveCamera(50,1,0.1,500);

scene.add(new THREE.HemisphereLight(0xbfefff,0x16351c,0.85));
const sun=new THREE.DirectionalLight(0xffffff,1.1);
sun.position.set(-30,60,30);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
const sd=90;sun.shadow.camera.left=-sd;sun.shadow.camera.right=sd;
sun.shadow.camera.top=sd;sun.shadow.camera.bottom=-sd;sun.shadow.camera.far=180;
scene.add(sun);

/* ── FIELD ── */
(function(){
  const g=new THREE.Group();
  for(let i=0;i<14;i++){
    const s=new THREE.Mesh(new THREE.PlaneGeometry(FIELD_W+16,FIELD_L/14),
      new THREE.MeshStandardMaterial({color:i%2?0x1f7a37:0x1a6e30,roughness:1}));
    s.rotation.x=-Math.PI/2;s.position.z=-HALF_L+(i+0.5)*(FIELD_L/14);s.receiveShadow=true;g.add(s);
  }
  const lm=new THREE.MeshBasicMaterial({color:0xffffff});
  function ln(w,h,x,z){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),lm);m.rotation.x=-Math.PI/2;m.position.set(x,0.02,z);g.add(m);}
  const t=0.22;
  ln(FIELD_W,t,0,0);ln(t,FIELD_L,-HALF_W,0);ln(t,FIELD_L,HALF_W,0);
  ln(FIELD_W,t,0,-HALF_L);ln(FIELD_W,t,0,HALF_L);
  // centre circle
  const ring=new THREE.Mesh(new THREE.RingGeometry(6,6.25,48),lm);
  ring.rotation.x=-Math.PI/2;ring.position.y=0.02;g.add(ring);
  const dot=new THREE.Mesh(new THREE.CircleGeometry(0.5,16),lm);
  dot.rotation.x=-Math.PI/2;dot.position.y=0.03;g.add(dot);
  // penalty areas
  const aW=32,aD=16;
  ln(aW,t,0,-HALF_L+aD);ln(t,aD*2,-aW/2,-HALF_L+aD/2);ln(t,aD*2,aW/2,-HALF_L+aD/2);
  ln(aW,t,0,HALF_L-aD);ln(t,aD*2,-aW/2,HALF_L-aD/2);ln(t,aD*2,aW/2,HALF_L-aD/2);
  const sW=18,sD=6;
  ln(sW,t,0,-HALF_L+sD);ln(t,sD*2,-sW/2,-HALF_L+sD/2);ln(t,sD*2,sW/2,-HALF_L+sD/2);
  ln(sW,t,0,HALF_L-sD);ln(t,sD*2,-sW/2,HALF_L-sD/2);ln(t,sD*2,sW/2,HALF_L-sD/2);
  // walls
  const wm=new THREE.MeshStandardMaterial({color:0x0c3b18,roughness:1});
  function wall(w,h,dp,x,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,dp),wm);m.position.set(x,h/2,z);m.castShadow=true;g.add(m);}
  wall(WALL,1.8,FIELD_L+WALL*2,-HALF_W-WALL/2,0);wall(WALL,1.8,FIELD_L+WALL*2,HALF_W+WALL/2,0);
  const sw2=(FIELD_W-GOAL_W)/2;
  wall(sw2,1.8,WALL,-(GOAL_W/2+sw2/2),-HALF_L-WALL/2);wall(sw2,1.8,WALL,(GOAL_W/2+sw2/2),-HALF_L-WALL/2);
  wall(sw2,1.8,WALL,-(GOAL_W/2+sw2/2),HALF_L+WALL/2);wall(sw2,1.8,WALL,(GOAL_W/2+sw2/2),HALF_L+WALL/2);
  // goals
  function goalFrame(z){
    const gm=new THREE.MeshStandardMaterial({color:0xeeeeee,metalness:0.3});
    const dir=z<0?-1:1;
    [-GOAL_W/2,GOAL_W/2].forEach(x=>{
      const p=new THREE.Mesh(new THREE.BoxGeometry(0.28,3.4,0.28),gm);
      p.position.set(x,1.7,z+dir*0.3);p.castShadow=true;g.add(p);
    });
    const bar=new THREE.Mesh(new THREE.BoxGeometry(GOAL_W+0.28,0.28,0.28),gm);
    bar.position.set(0,3.4,z+dir*0.3);g.add(bar);
    const net=new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W,3.4),
      new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.1,side:THREE.DoubleSide}));
    net.position.set(0,1.7,z+dir*2.8);g.add(net);
  }
  goalFrame(-HALF_L);goalFrame(HALF_L);
  // stands (simple bleachers)
  const standMat=new THREE.MeshStandardMaterial({color:0x1e293b,roughness:0.9});
  const crowd1=new THREE.Mesh(new THREE.BoxGeometry(FIELD_W+30,8,6),standMat);
  crowd1.position.set(0,4,-HALF_L-8);g.add(crowd1);
  const crowd2=new THREE.Mesh(new THREE.BoxGeometry(FIELD_W+30,8,6),standMat);
  crowd2.position.set(0,4,HALF_L+8);g.add(crowd2);
  const sideM=new THREE.MeshStandardMaterial({color:0x172032,roughness:0.9});
  const side1=new THREE.Mesh(new THREE.BoxGeometry(6,8,FIELD_L+10),sideM);
  side1.position.set(-HALF_W-8,4,0);g.add(side1);
  const side2=new THREE.Mesh(new THREE.BoxGeometry(6,8,FIELD_L+10),sideM);
  side2.position.set(HALF_W+8,4,0);g.add(side2);
  scene.add(g);
})();

/* ── PLAYER FACTORY ── */
function makePlayer(color){
  const g=new THREE.Group();
  const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:0.55});
  const skinC=0xf0c08a;
  const shortC=color===0x2563eb?0x1d4ed8:0xb91c1c;
  const sockC=0xffffff;

  // torso
  const torso=new THREE.Mesh(new THREE.BoxGeometry(1.0,1.0,0.55),mat(color));
  torso.position.y=1.5;torso.castShadow=true;g.add(torso);
  // neck
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.22,8),mat(skinC));
  neck.position.y=2.1;g.add(neck);
  // head
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.36,14,14),mat(skinC));
  head.position.y=2.48;head.castShadow=true;g.add(head);
  // hair
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.37,10,8,[0,Math.PI*2,0,Math.PI*0.5]),mat(0x2c1a0e));
  hair.position.y=2.5;g.add(hair);

  // arms
  function makeArm(side){
    const ag=new THREE.Group();
    const upper=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.12,0.58,8),mat(color));
    upper.position.y=-0.29;upper.castShadow=true;ag.add(upper);
    const lower=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.09,0.52,8),mat(skinC));
    lower.position.y=-0.85;lower.castShadow=true;ag.add(lower);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(0.11,8,8),mat(skinC));
    hand.position.y=-1.14;ag.add(hand);
    ag.position.set(side*0.64,1.82,0);ag.rotation.z=side*0.22;
    return ag;
  }
  const lArm=makeArm(-1),rArm=makeArm(1);
  g.add(lArm);g.add(rArm);

  // hips
  const hips=new THREE.Mesh(new THREE.BoxGeometry(0.85,0.28,0.48),mat(shortC));
  hips.position.y=0.96;g.add(hips);

  // legs
  function makeLeg(side){
    const lg=new THREE.Group();
    const thigh=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.17,0.62,8),mat(shortC));
    thigh.position.y=-0.31;lg.add(thigh);
    const shin=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.12,0.62,8),mat(sockC));
    shin.position.y=-0.95;lg.add(shin);
    const shoe=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.16,0.46),mat(0x111111));
    shoe.position.set(0,-1.38,0.1);lg.add(shoe);
    lg.position.set(side*0.26,0.88,0);
    return lg;
  }
  const lLeg=makeLeg(-1),rLeg=makeLeg(1);
  g.add(lLeg);g.add(rLeg);

  // selection ring
  const ring=new THREE.Mesh(new THREE.RingGeometry(1.05,1.3,24),
    new THREE.MeshBasicMaterial({color:0xfacc15,transparent:true,opacity:0.75,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2;ring.position.y=0.04;ring.visible=false;g.add(ring);

  g.userData={radius:P_RADIUS,ring,lArm,rArm,lLeg,rLeg,legPhase:Math.random()*Math.PI*2,heading:0,slideTimer:0,slideCd:0,isGK:false};
  scene.add(g);return g;
}

const BLUE=0x2563eb,RED=0xdc2626;
const myTeam=[],cpuTeam=[];
for(let i=0;i<TEAM_SIZE;i++)myTeam.push(makePlayer(BLUE));
for(let i=0;i<TEAM_SIZE;i++)cpuTeam.push(makePlayer(RED));
const allPlayers=[...myTeam,...cpuTeam];
myTeam[0].userData.isGK=true;cpuTeam[0].userData.isGK=true;
let controlled=myTeam[1];controlled.userData.ring.visible=true;

/* ball */
const ball=new THREE.Mesh(new THREE.SphereGeometry(BALL_R,24,24),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.3}));
ball.castShadow=true;ball.position.y=BALL_R;scene.add(ball);
// ball shadow disc
const bShadow=new THREE.Mesh(new THREE.CircleGeometry(0.55,16),
  new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.3,depthWrite:false}));
bShadow.rotation.x=-Math.PI/2;bShadow.position.y=0.01;scene.add(bShadow);
const ballVel=new THREE.Vector3();

/* formations — player attacks toward -Z (CPU goal) */
const formBlue=[{x:0,z:40},{x:-14,z:22},{x:14,z:22},{x:-8,z:4},{x:0,z:-20}];
const formRed= [{x:0,z:-40},{x:14,z:-22},{x:-14,z:-22},{x:8,z:-4},{x:0,z:20}];

const state={running:false,scoreMe:0,scoreCpu:0,time:MATCH_TIME};
const keys={};
const joy={x:0,y:0,active:false};
let runHeld=false;

function resetPositions(){
  for(let i=0;i<TEAM_SIZE;i++){
    myTeam[i].position.set(formBlue[i].x,0,formBlue[i].z);
    myTeam[i].rotation.set(0,Math.PI,0);myTeam[i].userData.heading=Math.PI;
    myTeam[i].userData.slideTimer=0;myTeam[i].userData.slideCd=0;
    cpuTeam[i].position.set(formRed[i].x,0,formRed[i].z);
    cpuTeam[i].rotation.set(0,0,0);cpuTeam[i].userData.heading=0;
    cpuTeam[i].userData.slideTimer=0;cpuTeam[i].userData.slideCd=0;
  }
  ball.position.set(0,BALL_R,0);ballVel.set(0,0,0);
}

/* ── INPUT ── */
addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="Space"){e.preventDefault();doKick(false);}
  if(e.code==="KeyZ")doKick(true);
  if(e.code==="KeyE")doSlide();
  if(e.code==="KeyQ")switchPlayer();
});
addEventListener("keyup",e=>{keys[e.code]=false;});

const stick=document.getElementById("stick"),knob=document.getElementById("knob");
let stickId=null;
function stickStart(e){stickId=e.changedTouches?e.changedTouches[0].identifier:"m";joy.active=true;stickMove(e);}
function stickMove(e){
  const touch=getTouch(e,stickId);if(!touch)return;
  const r=stick.getBoundingClientRect();
  let dx=touch.clientX-(r.left+r.width/2),dy=touch.clientY-(r.top+r.height/2);
  const max=r.width/2,len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  joy.x=dx/max;joy.y=dy/max;
}
function stickEnd(){stickId=null;joy.active=false;joy.x=joy.y=0;knob.style.transform="translate(0,0)";}
function getTouch(e,id){if(!e.changedTouches)return e;for(const t of e.changedTouches)if(t.identifier===id)return t;return null;}
stick.addEventListener("touchstart",e=>{e.preventDefault();stickStart(e);},{passive:false});
stick.addEventListener("touchmove",e=>{e.preventDefault();stickMove(e);},{passive:false});
stick.addEventListener("touchend",e=>{e.preventDefault();stickEnd();},{passive:false});
stick.addEventListener("mousedown",stickStart);
addEventListener("mousemove",e=>{if(joy.active&&stickId==="m")stickMove(e);});
addEventListener("mouseup",()=>{if(stickId==="m")stickEnd();});

function bindBtn(id,onS,onE){
  const el=document.getElementById(id);
  const s=e=>{e.preventDefault();el.classList.add("on");onS&&onS();};
  const en=e=>{e.preventDefault();el.classList.remove("on");onE&&onE();};
  el.addEventListener("touchstart",s,{passive:false});el.addEventListener("touchend",en,{passive:false});
  el.addEventListener("mousedown",s);el.addEventListener("mouseup",en);el.addEventListener("mouseleave",en);
}
bindBtn("bA",()=>doKick(false));       // disparo fuerte
bindBtn("bB",()=>doKick(false));       // chute raso (same, on ground)
bindBtn("bC",()=>doKick(true));        // chute elevado
bindBtn("bSwitch",switchPlayer);
bindBtn("bRun",()=>runHeld=true,()=>runHeld=false);

/* ── ACTIONS ── */
function distToBall(p){return Math.hypot(ball.position.x-p.position.x,ball.position.z-p.position.z);}
function clampToField(o){
  o.position.x=Math.max(-HALF_W+P_RADIUS,Math.min(HALF_W-P_RADIUS,o.position.x));
  o.position.z=Math.max(-HALF_L+P_RADIUS,Math.min(HALF_L-P_RADIUS,o.position.z));
}

function doKick(elevated){
  if(!state.running||distToBall(controlled)>2.8)return;
  const h=controlled.userData.heading;
  ballVel.set(Math.sin(h)*28,elevated?8:2,Math.cos(h)*28);
}
function doSlide(){
  if(!state.running)return;
  const ud=controlled.userData;if(ud.slideCd>0)return;
  ud.slideTimer=0.4;ud.slideCd=1.2;
}
function switchPlayer(){
  if(!state.running)return;
  let best=null,bestD=Infinity;
  for(const p of myTeam){if(p===controlled)continue;const d=distToBall(p);if(d<bestD){bestD=d;best=p;}}
  if(best){controlled.userData.ring.visible=false;controlled=best;controlled.userData.ring.visible=true;}
}

/* ── PHYSICS ── */
function resolvePlayerBall(p){
  const dx=ball.position.x-p.position.x,dz=ball.position.z-p.position.z;
  const dist=Math.hypot(dx,dz),minD=P_RADIUS+BALL_R;
  if(dist<minD&&dist>0.001){
    const nx=dx/dist,nz=dz/dist;
    ball.position.x=p.position.x+nx*minD;ball.position.z=p.position.z+nz*minD;
    const sliding=p===controlled&&controlled.userData.slideTimer>0;
    if(sliding){ballVel.x=nx*24;ballVel.z=nz*24;}
    else{ballVel.x+=nx*8*0.3;ballVel.z+=nz*8*0.3;}
  }
}
function resolvePlayerPlayer(a,b){
  const dx=b.position.x-a.position.x,dz=b.position.z-a.position.z;
  const dist=Math.hypot(dx,dz),minD=P_RADIUS*2;
  if(dist<minD&&dist>0.001){
    const nx=dx/dist,nz=dz/dist,o=(minD-dist)/2;
    a.position.x-=nx*o;a.position.z-=nz*o;b.position.x+=nx*o;b.position.z+=nz*o;
  }
}

/* ── ANIMATION ── */
function animatePlayer(p,spd,dt){
  const ud=p.userData;if(!ud.lLeg)return;
  ud.legPhase+=spd*dt*3.2;
  const sw=Math.min(spd*0.055,0.5);
  ud.lLeg.rotation.x=Math.sin(ud.legPhase)*sw;
  ud.rLeg.rotation.x=Math.sin(ud.legPhase+Math.PI)*sw;
  ud.lArm.rotation.x=Math.sin(ud.legPhase+Math.PI)*sw*0.65;
  ud.rArm.rotation.x=Math.sin(ud.legPhase)*sw*0.65;
}

/* ── AI ── */
function updateTeammateAI(p,idx,dt){
  const ud=p.userData,base=formBlue[idx];
  let tx=base.x+ball.position.x*0.3,tz=base.z+ball.position.z*0.2;
  const dBall=distToBall(p);
  let closest=true;
  for(const t of myTeam){if(t===controlled||t===p)continue;if(distToBall(t)<dBall){closest=false;break;}}
  if(closest&&!ud.isGK&&dBall<28&&ball.position.z>-15){tx=ball.position.x;tz=ball.position.z;}
  if(ud.isGK){tx=Math.max(-7,Math.min(7,ball.position.x*0.5));tz=Math.max(36,Math.min(44,40+ball.position.z*0.04));}
  const dx=tx-p.position.x,dz=tz-p.position.z,len=Math.hypot(dx,dz);
  if(len>0.5){const sp=8.5*dt;p.position.x+=(dx/len)*Math.min(sp,len);p.position.z+=(dz/len)*Math.min(sp,len);ud.heading=Math.atan2(dx,dz);p.rotation.y=ud.heading;animatePlayer(p,8.5,dt);}
  if(dBall<2.2&&!ud.isGK){const v=new THREE.Vector3(-p.position.x*0.1,0,-1).normalize();ballVel.set(v.x*20,1.5,v.z*20);}
  if(ud.isGK&&dBall<2.0){const v=new THREE.Vector3(-ball.position.x*0.1,0,-1).normalize();ballVel.set(v.x*25,2,v.z*25);}
  clampToField(p);
}
function updateCpuAI(p,idx,dt){
  const ud=p.userData,base=formRed[idx];
  let tx=base.x+ball.position.x*0.3,tz=base.z+ball.position.z*0.2;
  const dBall=distToBall(p);
  let closest=true;
  for(const t of cpuTeam){if(t===p)continue;if(distToBall(t)<dBall){closest=false;break;}}
  if(closest&&!ud.isGK&&dBall<30){tx=ball.position.x;tz=ball.position.z;}
  if(ud.isGK){tx=Math.max(-7,Math.min(7,ball.position.x*0.5));tz=Math.min(-36,Math.max(-44,-40+ball.position.z*0.04));}
  const dx=tx-p.position.x,dz=tz-p.position.z,len=Math.hypot(dx,dz);
  const sp=(closest&&!ud.isGK?10.5:8)*dt;
  if(len>0.5){p.position.x+=(dx/len)*Math.min(sp,len);p.position.z+=(dz/len)*Math.min(sp,len);ud.heading=Math.atan2(dx,dz);p.rotation.y=ud.heading;animatePlayer(p,8,dt);}
  if(dBall<2.2&&!ud.isGK){const v=new THREE.Vector3(-ball.position.x*0.12,0,1).normalize();ballVel.set(v.x*22,1.5,v.z*22);}
  if(ud.isGK&&dBall<2.0){const v=new THREE.Vector3(-ball.position.x*0.1,0,1).normalize();ballVel.set(v.x*25,2,v.z*25);}
  clampToField(p);
}

/* ── GOALS ── */
function checkGoal(){
  if(Math.abs(ball.position.x)>GOAL_W/2)return;
  if(ball.position.z<-HALF_L+0.3){state.scoreMe++;onGoal("¡GOOOL! ⚽");}
  else if(ball.position.z>HALF_L-0.3){state.scoreCpu++;onGoal("Gol de la CPU 😤");}
}
function onGoal(text){
  document.getElementById("sMe").textContent=state.scoreMe;
  document.getElementById("sCpu").textContent=state.scoreCpu;
  state.running=false;flash(text,"");
  setTimeout(()=>{resetPositions();hideMsg();state.running=true;},1600);
}

/* ── MINIMAP ── */
const mm=document.getElementById("minimap");
// position minimap
mm.style.position="fixed";
mm.style.left="50%";mm.style.transform="translateX(-50%)";
mm.style.bottom="calc(12px + env(safe-area-inset-bottom, 0px))";
mm.style.width="110px";mm.style.height="70px";
mm.style.zIndex="5";mm.style.pointerEvents="none";
const mmCtx=mm.getContext("2d");
function drawMinimap(){
  const W=110,H=70;
  mm.width=W;mm.height=H;
  mmCtx.clearRect(0,0,W,H);
  // bg
  mmCtx.fillStyle="rgba(0,0,0,.5)";
  mmCtx.roundRect(0,0,W,H,5);mmCtx.fill();
  // field
  mmCtx.strokeStyle="rgba(255,255,255,.3)";mmCtx.lineWidth=1;
  mmCtx.strokeRect(4,3,W-8,H-6);
  // midline
  mmCtx.beginPath();mmCtx.moveTo(W/2,3);mmCtx.lineTo(W/2,H-3);mmCtx.stroke();
  // players
  function dot(p,color){
    const px=4+(p.position.x+HALF_W)/(FIELD_W)*(W-8);
    const pz=3+(p.position.z+HALF_L)/(FIELD_L)*(H-6);
    mmCtx.beginPath();mmCtx.arc(px,pz,3,0,Math.PI*2);
    mmCtx.fillStyle=color;mmCtx.fill();
    if(p===controlled){mmCtx.strokeStyle="#facc15";mmCtx.lineWidth=1.5;mmCtx.stroke();}
  }
  myTeam.forEach(p=>dot(p,"#60a5fa"));
  cpuTeam.forEach(p=>dot(p,"#f87171"));
  // ball
  const bx=4+(ball.position.x+HALF_W)/(FIELD_W)*(W-8);
  const bz=3+(ball.position.z+HALF_L)/(FIELD_L)*(H-6);
  mmCtx.beginPath();mmCtx.arc(bx,bz,2.5,0,Math.PI*2);
  mmCtx.fillStyle="#fff";mmCtx.fill();
}

/* ── MAIN LOOP ── */
let last=performance.now();
// Camera state — eFootball style: from behind player team, high angle
const camState={x:0,y:45,z:HALF_L+35};

function tick(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;

  if(state.running){
    /* player movement */
    let mx=0,mz=0;
    if(keys["KeyW"]||keys["ArrowUp"])mz-=1;
    if(keys["KeyS"]||keys["ArrowDown"])mz+=1;
    if(keys["KeyA"]||keys["ArrowLeft"])mx-=1;
    if(keys["KeyD"]||keys["ArrowRight"])mx+=1;
    if(joy.active){mx+=joy.x;mz+=joy.y;}
    const mlen=Math.hypot(mx,mz);
    const cud=controlled.userData;
    cud.slideCd=Math.max(0,cud.slideCd-dt);
    let speed=(runHeld||keys["ShiftLeft"]||keys["ShiftRight"])?14:9.5;
    if(cud.slideTimer>0){cud.slideTimer-=dt;speed=18;}
    if(mlen>0.15){
      mx/=mlen;mz/=mlen;
      controlled.position.x+=mx*speed*dt;
      controlled.position.z+=mz*speed*dt;
      cud.heading=Math.atan2(mx,mz);controlled.rotation.y=cud.heading;
      animatePlayer(controlled,speed,dt);
    }else if(cud.slideTimer>0){
      controlled.position.x+=Math.sin(cud.heading)*speed*dt;
      controlled.position.z+=Math.cos(cud.heading)*speed*dt;
    }
    controlled.rotation.x=cud.slideTimer>0?-0.6:0;
    clampToField(controlled);

    /* teammate & CPU AI */
    for(let i=0;i<TEAM_SIZE;i++){if(myTeam[i]!==controlled)updateTeammateAI(myTeam[i],i,dt);}
    for(let i=0;i<TEAM_SIZE;i++)updateCpuAI(cpuTeam[i],i,dt);

    /* collisions */
    for(let i=0;i<allPlayers.length;i++){
      for(let j=i+1;j<allPlayers.length;j++)resolvePlayerPlayer(allPlayers[i],allPlayers[j]);
      resolvePlayerBall(allPlayers[i]);
    }

    /* ball physics — low bounce, ground-hugging */
    ballVel.y-=28*dt;
    ball.position.addScaledVector(ballVel,dt);
    if(ball.position.y<BALL_R){
      ball.position.y=BALL_R;
      ballVel.y*=-0.25;
      if(Math.abs(ballVel.y)<1.5)ballVel.y=0;
    }
    const fr=Math.pow(0.08,dt);ballVel.x*=fr;ballVel.z*=fr;
    ball.rotation.x+=ballVel.z*dt*0.5;ball.rotation.z-=ballVel.x*dt*0.5;
    // ball shadow follows ball on ground
    bShadow.position.x=ball.position.x;bShadow.position.z=ball.position.z;
    bShadow.material.opacity=0.3*Math.max(0,1-(ball.position.y-BALL_R)/4);

    /* walls */
    const inGoal=Math.abs(ball.position.x)<GOAL_W/2;
    if(ball.position.x<-HALF_W+BALL_R){ball.position.x=-HALF_W+BALL_R;ballVel.x*=-0.5;}
    if(ball.position.x>HALF_W-BALL_R){ball.position.x=HALF_W-BALL_R;ballVel.x*=-0.5;}
    if(!inGoal){
      if(ball.position.z<-HALF_L+BALL_R){ball.position.z=-HALF_L+BALL_R;ballVel.z*=-0.5;}
      if(ball.position.z>HALF_L-BALL_R){ball.position.z=HALF_L-BALL_R;ballVel.z*=-0.5;}
    }
    checkGoal();

    /* timer */
    state.time-=dt;if(state.time<=0){state.time=0;endMatch();}
    updateTimer();

    /* auto-switch */
    for(const p of myTeam){
      if(p===controlled||p.userData.isGK)continue;
      if(distToBall(p)<1.8&&distToBall(controlled)>7){
        controlled.userData.ring.visible=false;controlled=p;controlled.userData.ring.visible=true;break;
      }
    }

    drawMinimap();
  }

  /* ── eFootball camera: behind blue team (z>0), high angle, wide view ── */
  // Follow ball laterally (x), stay behind player side (z positive), high (y)
  const targetX=ball.position.x*0.25;
  const targetZ=ball.position.z*0.15+HALF_L*0.55; // stays somewhat fixed behind
  const targetY=42;
  camState.x+=(targetX-camState.x)*0.05;
  camState.z+=(targetZ-camState.z)*0.04;
  camState.y+=(targetY-camState.y)*0.04;
  camera.position.set(camState.x,camState.y,camState.z);
  // look at a point ahead on the field (toward CPU goal)
  camera.lookAt(ball.position.x*0.2,0,ball.position.z*0.2-8);

  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}

function updateTimer(){
  const m=Math.floor(state.time/60),s=Math.floor(state.time%60);
  document.getElementById("timer").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

const msg=document.getElementById("msg");
function flash(t,sub){document.getElementById("msgT").textContent=t;document.getElementById("msgP").textContent=sub||"";document.getElementById("btnStart").style.display="none";msg.style.display="grid";}
function hideMsg(){msg.style.display="none";}
function showStart(t,sub){document.getElementById("msgT").textContent=t;document.getElementById("msgP").textContent=sub;document.getElementById("btnStart").style.display="inline-block";msg.style.display="grid";}
function endMatch(){
  state.running=false;
  const t=state.scoreMe>state.scoreCpu?"🏆 ¡Ganaste!":state.scoreMe<state.scoreCpu?"😤 Perdiste":"🤝 Empate";
  showStart(t,`${state.scoreMe} - ${state.scoreCpu}`);
  document.getElementById("btnStart").textContent="JUGAR DE NUEVO";
}
function startMatch(){
  state.scoreMe=0;state.scoreCpu=0;state.time=MATCH_TIME;
  document.getElementById("sMe").textContent=0;document.getElementById("sCpu").textContent=0;
  resetPositions();updateTimer();hideMsg();state.running=true;
}
document.getElementById("btnStart").addEventListener("click",startMatch);

function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener("resize",resize);resize();

resetPositions();
camera.position.set(0,42,HALF_L*0.55);
camera.lookAt(0,0,-8);
showStart("⚽ FFc · Player vs CPU","5 vs 5 · Tú (azul) vs CPU (rojo)");
requestAnimationFrame(tick);
})();
</script>
