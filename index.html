<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FFc · Fútbol 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a2e12; font-family: system-ui, sans-serif; user-select: none; }
  #game { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center; gap: 18px;
    padding: 10px 14px; pointer-events: none;
    font-weight: 800; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
  #hud .team-score { display: flex; align-items: center; gap: 6px; }
  #hud .score { font-size: 34px; letter-spacing: 1px; }
  #hud .label { font-size: 11px; opacity: .8; }
  #hud .crest { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; }
  .crest-blue { background: #2563eb; }
  .crest-red  { background: #dc2626; }
  #timer { font-size: 20px; background: rgba(0,0,0,.4); padding: 4px 14px; border-radius: 20px; }

  #msg {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(0,0,0,.6); color: #fff; text-align: center; z-index: 10;
  }
  #msg .box { padding: 28px 34px; }
  #msg h1 { font-size: 38px; margin-bottom: 8px; }
  #msg p { font-size: 15px; opacity: .85; margin-bottom: 20px; }
  #msg button {
    font-size: 18px; font-weight: 800; padding: 12px 28px; border: none; border-radius: 12px;
    background: #22c55e; color: #052e13; cursor: pointer;
  }

  /* Controls */
  #controls { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .btn {
    position: absolute; pointer-events: auto;
    width: 72px; height: 72px; border-radius: 50%;
    display: grid; place-items: center; text-align: center;
    font-weight: 800; font-size: 11px; color: #fff; letter-spacing: .5px;
    border: 2px solid rgba(255,255,255,.35);
    background: rgba(0,0,0,.35); backdrop-filter: blur(4px);
    touch-action: none; transition: transform .08s, filter .08s;
  }
  .btn:active, .btn.on { transform: scale(.9); filter: brightness(1.4); }
  #bKick   { right: 20px;  bottom: 148px; background: rgba(34,197,94,.5); }
  #bSlide  { right: 104px; bottom: 76px;  background: rgba(59,130,246,.5); }
  #bRun    { right: 20px;  bottom: 38px;  background: rgba(234,179,8,.5); }
  #bSwitch { right: 104px; bottom: 160px; background: rgba(168,85,247,.5); width: 60px; height: 60px; font-size: 10px; }

  /* Joystick */
  #stick { position: absolute; left: 24px; bottom: 32px; width: 130px; height: 130px;
           border-radius: 50%; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.2);
           pointer-events: auto; touch-action: none; }
  #knob  { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
           border-radius: 50%; background: rgba(255,255,255,.5); }

  #hint { position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%);
          color: #fff; opacity: .45; font-size: 10px; pointer-events: none; white-space: nowrap; }

  /* Player indicator ring */
  .player-ring { position: absolute; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="team-score">
    <div class="crest crest-blue">⚽</div>
    <div><div class="score"><span id="sMe">0</span></div><div class="label">TÚ</div></div>
  </div>
  <div id="timer">02:00</div>
  <div class="team-score">
    <div><div class="score"><span id="sCpu">0</span></div><div class="label">CPU</div></div>
    <div class="crest crest-red">🤖</div>
  </div>
</div>

<div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <div class="btn" id="bSwitch">CAMBIAR</div>
  <div class="btn" id="bRun">CORRER</div>
  <div class="btn" id="bSlide">BARRER</div>
  <div class="btn" id="bKick">PATEAR</div>
</div>

<div id="msg"><div class="box"><h1 id="msgT">⚽ FFc</h1><p id="msgP">Player vs CPU · 5v5</p><button id="btnStart">JUGAR</button></div></div>

<div id="hint">Mover: WASD · Patear: Espacio · Barrer: E · Correr: Shift · Cambiar jugador: Q</div>

<script src="libs/three.min.js"></script>
<script>
(function () {
  "use strict";
  const THREE = window.THREE;

  /* ======== CONFIG ======== */
  const FIELD_W  = 48;
  const FIELD_L  = 68;
  const GOAL_W   = 14;
  const WALL     = 1;
  const HALF_W   = FIELD_W / 2;
  const HALF_L   = FIELD_L / 2;
  const BALL_R   = 0.55;
  const P_RADIUS = 0.85;
  const TEAM_SIZE = 5;          // 5 vs 5 (incluye portero)
  const MATCH_TIME = 150;       // 2:30

  /* ======== RENDERER ======== */
  const canvas = document.getElementById("game");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a2e12);
  scene.fog = new THREE.Fog(0x0a2e12, 65, 140);

  const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 500);

  /* ======== LIGHTS ======== */
  scene.add(new THREE.HemisphereLight(0xbfefff, 0x16351c, 0.85));
  const sun = new THREE.DirectionalLight(0xffffff, 1.15);
  sun.position.set(-22, 48, 22);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const sd = 58;
  sun.shadow.camera.left = -sd; sun.shadow.camera.right = sd;
  sun.shadow.camera.top = sd; sun.shadow.camera.bottom = -sd;
  sun.shadow.camera.far = 130;
  scene.add(sun);

  /* ======== FIELD ======== */
  (function buildField() {
    const grp = new THREE.Group();
    // césped franjas
    for (let i = 0; i < 12; i++) {
      const s = new THREE.Mesh(
        new THREE.PlaneGeometry(FIELD_W + 12, FIELD_L / 12),
        new THREE.MeshStandardMaterial({ color: i % 2 ? 0x1f7a37 : 0x1a6e30, roughness: 1 }));
      s.rotation.x = -Math.PI / 2;
      s.position.z = -HALF_L + (i + 0.5) * (FIELD_L / 12);
      s.receiveShadow = true; grp.add(s);
    }
    // líneas
    const lm = new THREE.MeshBasicMaterial({ color: 0xffffff });
    function ln(w, h, x, z) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), lm); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.02, z); grp.add(m); }
    const t = 0.22;
    ln(FIELD_W, t, 0, 0); // media cancha
    ln(t, FIELD_L, -HALF_W, 0); ln(t, FIELD_L, HALF_W, 0); // bandas
    ln(FIELD_W, t, 0, -HALF_L); ln(FIELD_W, t, 0, HALF_L); // fondos
    const ring = new THREE.Mesh(new THREE.RingGeometry(5.8, 6.05, 48), lm);
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02; grp.add(ring);
    // áreas grandes
    const areaW = 26, areaD = 10;
    ln(areaW, t, 0, -HALF_L + areaD); ln(t, areaD * 2, -areaW / 2, -HALF_L + areaD / 2); ln(t, areaD * 2, areaW / 2, -HALF_L + areaD / 2);
    ln(areaW, t, 0, HALF_L - areaD);  ln(t, areaD * 2, -areaW / 2, HALF_L - areaD / 2);  ln(t, areaD * 2, areaW / 2, HALF_L - areaD / 2);
    // áreas chicas
    const saW = 14, saD = 4;
    ln(saW, t, 0, -HALF_L + saD); ln(t, saD * 2, -saW / 2, -HALF_L + saD / 2); ln(t, saD * 2, saW / 2, -HALF_L + saD / 2);
    ln(saW, t, 0, HALF_L - saD);  ln(t, saD * 2, -saW / 2, HALF_L - saD / 2);  ln(t, saD * 2, saW / 2, HALF_L - saD / 2);

    // bordes / vallas
    const wm = new THREE.MeshStandardMaterial({ color: 0x0c3b18, roughness: 1 });
    function wall(w, h, dp, x, z) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, dp), wm); m.position.set(x, h / 2, z); m.castShadow = true; grp.add(m); }
    wall(WALL, 1.8, FIELD_L + WALL * 2, -HALF_W - WALL / 2, 0);
    wall(WALL, 1.8, FIELD_L + WALL * 2,  HALF_W + WALL / 2, 0);
    const sideW = (FIELD_W - GOAL_W) / 2;
    wall(sideW, 1.8, WALL, -(GOAL_W / 2 + sideW / 2), -HALF_L - WALL / 2);
    wall(sideW, 1.8, WALL,  (GOAL_W / 2 + sideW / 2), -HALF_L - WALL / 2);
    wall(sideW, 1.8, WALL, -(GOAL_W / 2 + sideW / 2),  HALF_L + WALL / 2);
    wall(sideW, 1.8, WALL,  (GOAL_W / 2 + sideW / 2),  HALF_L + WALL / 2);

    // porterías
    function goalFrame(z) {
      const gm = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.3 });
      const post = new THREE.BoxGeometry(0.28, 3.2, 0.28);
      const dir = z < 0 ? -1 : 1;
      [-GOAL_W / 2, GOAL_W / 2].forEach(x => { const p = new THREE.Mesh(post, gm); p.position.set(x, 1.6, z + dir * 0.3); p.castShadow = true; grp.add(p); });
      const bar = new THREE.Mesh(new THREE.BoxGeometry(GOAL_W + 0.28, 0.28, 0.28), gm);
      bar.position.set(0, 3.2, z + dir * 0.3); grp.add(bar);
      const net = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W, 3.2),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1, side: THREE.DoubleSide }));
      net.position.set(0, 1.6, z + dir * 2.5); grp.add(net);
    }
    goalFrame(-HALF_L); goalFrame(HALF_L);
    scene.add(grp);
  })();

  /* ======== PLAYER FACTORY ======== */
  function makePlayer(color, number) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.65, 1.3, 4, 10),
      new THREE.MeshStandardMaterial({ color, roughness: 0.55 }));
    body.position.y = 1.35; body.castShadow = true; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 14, 14),
      new THREE.MeshStandardMaterial({ color: 0xf0c08a }));
    head.position.y = 2.55; head.castShadow = true; g.add(head);
    // dirección
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.5, 6),
      new THREE.MeshStandardMaterial({ color: 0x111111 }));
    nose.rotation.x = Math.PI / 2; nose.position.set(0, 1.35, 0.72); g.add(nose);
    // anillo de selección (invisible por defecto)
    const ringG = new THREE.Mesh(new THREE.RingGeometry(1.1, 1.35, 24),
      new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.7, side: THREE.DoubleSide }));
    ringG.rotation.x = -Math.PI / 2; ringG.position.y = 0.05;
    ringG.visible = false; g.add(ringG);
    g.userData = { radius: P_RADIUS, ring: ringG, heading: 0, slideTimer: 0, slideCd: 0, isGK: false, number };
    scene.add(g);
    return g;
  }

  /* ======== TEAMS ======== */
  const BLUE = 0x2563eb, RED = 0xdc2626;
  const myTeam  = [];   // tu equipo (azul)
  const cpuTeam = [];   // CPU (rojo)
  for (let i = 0; i < TEAM_SIZE; i++) myTeam.push(makePlayer(BLUE, i + 1));
  for (let i = 0; i < TEAM_SIZE; i++) cpuTeam.push(makePlayer(RED, i + 1));
  const allPlayers = [...myTeam, ...cpuTeam];

  // porteros
  myTeam[0].userData.isGK = true;
  cpuTeam[0].userData.isGK = true;

  let controlled = myTeam[1]; // empiezas controlando al 2 (delantero centro)
  controlled.userData.ring.visible = true;

  /* ======== BALL ======== */
  const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35 });
  const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 24, 24), ballMat);
  ball.castShadow = true; ball.position.y = BALL_R; scene.add(ball);
  const ballVel = new THREE.Vector3();

  /* ======== FORMATION POSITIONS ======== */
  // Posiciones base relativas (x, z). z positivo = lado propio (+Z = arco azul)
  // Equipo azul ataca hacia -Z, equipo rojo ataca hacia +Z
  const formBlue = [
    { x: 0, z: 28 },     // GK
    { x: -10, z: 12 },   // DEF izq
    { x: 10, z: 12 },    // DEF der
    { x: -6, z: -2 },    // MED izq
    { x: 0, z: -14 },    // DEL centro
  ];
  const formRed = [
    { x: 0, z: -28 },
    { x: 10, z: -12 },
    { x: -10, z: -12 },
    { x: 6, z: 2 },
    { x: 0, z: 14 },
  ];

  /* ======== STATE ======== */
  const state = { running: false, scoreMe: 0, scoreCpu: 0, time: MATCH_TIME };
  const keys = {};
  const joy = { x: 0, y: 0, active: false };
  let runHeld = false;

  function resetPositions() {
    for (let i = 0; i < TEAM_SIZE; i++) {
      myTeam[i].position.set(formBlue[i].x, 0, formBlue[i].z);
      myTeam[i].rotation.set(0, Math.PI, 0);
      myTeam[i].userData.heading = Math.PI;
      myTeam[i].userData.slideTimer = 0; myTeam[i].userData.slideCd = 0;
      cpuTeam[i].position.set(formRed[i].x, 0, formRed[i].z);
      cpuTeam[i].rotation.set(0, 0, 0);
      cpuTeam[i].userData.heading = 0;
      cpuTeam[i].userData.slideTimer = 0; cpuTeam[i].userData.slideCd = 0;
    }
    ball.position.set(0, BALL_R, 0);
    ballVel.set(0, 0, 0);
  }

  /* ======== INPUT ======== */
  addEventListener("keydown", e => {
    keys[e.code] = true;
    if (e.code === "Space")  { e.preventDefault(); doKick(); }
    if (e.code === "KeyE")   doSlide();
    if (e.code === "KeyQ")   switchPlayer();
  });
  addEventListener("keyup", e => { keys[e.code] = false; });

  // Joystick
  const stick = document.getElementById("stick"), knob = document.getElementById("knob");
  let stickId = null;
  function stickStart(e) { stickId = e.changedTouches ? e.changedTouches[0].identifier : "m"; joy.active = true; stickMove(e); }
  function stickMove(e) {
    const touch = getTouch(e, stickId); if (!touch) return;
    const r = stick.getBoundingClientRect();
    let dx = touch.clientX - (r.left + r.width / 2), dy = touch.clientY - (r.top + r.height / 2);
    const max = r.width / 2, len = Math.hypot(dx, dy);
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    joy.x = dx / max; joy.y = dy / max;
  }
  function stickEnd() { stickId = null; joy.active = false; joy.x = joy.y = 0; knob.style.transform = "translate(0,0)"; }
  function getTouch(e, id) { if (!e.changedTouches) return e; for (const t of e.changedTouches) if (t.identifier === id) return t; return null; }
  stick.addEventListener("touchstart", e => { e.preventDefault(); stickStart(e); }, { passive: false });
  stick.addEventListener("touchmove",  e => { e.preventDefault(); stickMove(e); },  { passive: false });
  stick.addEventListener("touchend",   e => { e.preventDefault(); stickEnd(); },     { passive: false });
  stick.addEventListener("mousedown", stickStart);
  addEventListener("mousemove", e => { if (joy.active && stickId === "m") stickMove(e); });
  addEventListener("mouseup", () => { if (stickId === "m") stickEnd(); });

  // Botones
  function bind(id, onStart, onEnd) {
    const el = document.getElementById(id);
    const s = e => { e.preventDefault(); el.classList.add("on"); onStart && onStart(); };
    const en = e => { e.preventDefault(); el.classList.remove("on"); onEnd && onEnd(); };
    el.addEventListener("touchstart", s, { passive: false }); el.addEventListener("touchend", en, { passive: false });
    el.addEventListener("mousedown", s); el.addEventListener("mouseup", en); el.addEventListener("mouseleave", en);
  }
  bind("bKick", doKick);
  bind("bSlide", doSlide);
  bind("bRun", () => runHeld = true, () => runHeld = false);
  bind("bSwitch", switchPlayer);

  /* ======== HELPERS ======== */
  function dist2D(a, b) { return Math.hypot(a.position.x - b.position.x, a.position.z - b.position.z); }
  function distToBall(p) { return Math.hypot(ball.position.x - p.position.x, ball.position.z - p.position.z); }

  function clampToField(obj) {
    const lx = HALF_W - P_RADIUS, lz = HALF_L - P_RADIUS;
    obj.position.x = Math.max(-lx, Math.min(lx, obj.position.x));
    obj.position.z = Math.max(-lz, Math.min(lz, obj.position.z));
  }

  /* ======== ACTIONS ======== */
  function doKick() {
    if (!state.running) return;
    if (distToBall(controlled) > 2.8) return;
    const h = controlled.userData.heading;
    const power = 28;
    ballVel.set(Math.sin(h) * power, 7, Math.cos(h) * power);
  }

  function doSlide() {
    if (!state.running) return;
    const ud = controlled.userData;
    if (ud.slideCd > 0) return;
    ud.slideTimer = 0.4;
    ud.slideCd = 1.2;
  }

  function switchPlayer() {
    if (!state.running) return;
    // elige al compañero más cercano al balón que no sea el actual
    let best = null, bestD = Infinity;
    for (const p of myTeam) {
      if (p === controlled) continue;
      const d = distToBall(p);
      if (d < bestD) { bestD = d; best = p; }
    }
    if (best) {
      controlled.userData.ring.visible = false;
      controlled = best;
      controlled.userData.ring.visible = true;
    }
  }

  /* ======== PHYSICS ======== */
  function resolvePlayerBall(p, isMyTeam) {
    const dx = ball.position.x - p.position.x, dz = ball.position.z - p.position.z;
    const dist = Math.hypot(dx, dz), minD = P_RADIUS + BALL_R;
    if (dist < minD && dist > 0.001) {
      const nx = dx / dist, nz = dz / dist;
      ball.position.x = p.position.x + nx * minD;
      ball.position.z = p.position.z + nz * minD;
      const isSliding = p === controlled && controlled.userData.slideTimer > 0;
      const push = isSliding ? 24 : 8;
      if (isSliding) { ballVel.x = nx * push; ballVel.z = nz * push; }
      else { ballVel.x += nx * push * 0.3; ballVel.z += nz * push * 0.3; }
    }
  }

  function resolvePlayerPlayer(a, b) {
    const dx = b.position.x - a.position.x, dz = b.position.z - a.position.z;
    const dist = Math.hypot(dx, dz), minD = P_RADIUS * 2;
    if (dist < minD && dist > 0.001) {
      const nx = dx / dist, nz = dz / dist, o = (minD - dist) / 2;
      a.position.x -= nx * o; a.position.z -= nz * o;
      b.position.x += nx * o; b.position.z += nz * o;
    }
  }

  /* ======== AI: TEAMMATE (your team, not controlled) ======== */
  function updateTeammateAI(p, idx, dt) {
    const ud = p.userData;
    const base = formBlue[idx];
    // Shift position based on ball
    const ballInfluence = 0.35;
    let targetX = base.x + ball.position.x * ballInfluence;
    let targetZ = base.z + ball.position.z * 0.25;

    // If closest teammate to ball and ball is in our half (z > 0), go get it
    const dBall = distToBall(p);
    let closestToBall = true;
    for (const t of myTeam) {
      if (t === controlled || t === p) continue;
      if (distToBall(t) < dBall) { closestToBall = false; break; }
    }
    if (closestToBall && !ud.isGK && dBall < 18 && ball.position.z > -5) {
      targetX = ball.position.x; targetZ = ball.position.z;
    }

    // GK stays in goal area
    if (ud.isGK) {
      targetX = Math.max(-5, Math.min(5, ball.position.x * 0.5));
      targetZ = Math.max(24, Math.min(30, 28 + ball.position.z * 0.05));
    }

    const dx = targetX - p.position.x, dz = targetZ - p.position.z;
    const len = Math.hypot(dx, dz);
    if (len > 0.5) {
      const spd = 8.5 * dt;
      p.position.x += (dx / len) * Math.min(spd, len);
      p.position.z += (dz / len) * Math.min(spd, len);
      ud.heading = Math.atan2(dx, dz);
      p.rotation.y = ud.heading;
    }

    // If very close to ball, kick toward CPU goal (-Z)
    if (dBall < 2.2 && !ud.isGK) {
      const aimX = -p.position.x * 0.12;
      const v = new THREE.Vector3(aimX, 0, -1).normalize();
      ballVel.set(v.x * 20, 5, v.z * 20);
    }
    // GK kicks ball away
    if (ud.isGK && dBall < 2.0) {
      const v = new THREE.Vector3(-ball.position.x * 0.1, 0, -1).normalize();
      ballVel.set(v.x * 25, 8, v.z * 25);
    }
    clampToField(p);
  }

  /* ======== AI: CPU TEAM ======== */
  function updateCpuAI(p, idx, dt) {
    const ud = p.userData;
    const base = formRed[idx];
    const ballInfluence = 0.35;
    let targetX = base.x + ball.position.x * ballInfluence;
    let targetZ = base.z + ball.position.z * 0.25;

    const dBall = distToBall(p);

    // Closest CPU player to ball chases it
    let closestToBall = true;
    for (const t of cpuTeam) {
      if (t === p) continue;
      if (distToBall(t) < dBall) { closestToBall = false; break; }
    }
    if (closestToBall && !ud.isGK && dBall < 20) {
      targetX = ball.position.x; targetZ = ball.position.z;
    }

    // GK
    if (ud.isGK) {
      targetX = Math.max(-5, Math.min(5, ball.position.x * 0.5));
      targetZ = Math.min(-24, Math.max(-30, -28 + ball.position.z * 0.05));
    }

    const dx = targetX - p.position.x, dz = targetZ - p.position.z;
    const len = Math.hypot(dx, dz);
    const spd = (closestToBall && !ud.isGK ? 10.5 : 8) * dt;
    if (len > 0.5) {
      p.position.x += (dx / len) * Math.min(spd, len);
      p.position.z += (dz / len) * Math.min(spd, len);
      ud.heading = Math.atan2(dx, dz);
      p.rotation.y = ud.heading;
    }

    // Kick toward player goal (+Z)
    if (dBall < 2.2 && !ud.isGK) {
      const aimX = -ball.position.x * 0.15;
      const v = new THREE.Vector3(aimX, 0, 1).normalize();
      ballVel.set(v.x * 22, 5, v.z * 22);
    }
    if (ud.isGK && dBall < 2.0) {
      const v = new THREE.Vector3(-ball.position.x * 0.1, 0, 1).normalize();
      ballVel.set(v.x * 25, 8, v.z * 25);
    }
    clampToField(p);
  }

  /* ======== GOALS ======== */
  function checkGoal() {
    if (Math.abs(ball.position.x) > GOAL_W / 2) return false;
    if (ball.position.z < -HALF_L + 0.3) { state.scoreMe++; onGoal("¡GOOOL! ⚽"); return true; }
    if (ball.position.z >  HALF_L - 0.3) { state.scoreCpu++; onGoal("Gol de la CPU 😤"); return true; }
    return false;
  }
  function onGoal(text) {
    document.getElementById("sMe").textContent = state.scoreMe;
    document.getElementById("sCpu").textContent = state.scoreCpu;
    state.running = false;
    flash(text, "");
    setTimeout(() => { resetPositions(); hideMsg(); state.running = true; }, 1600);
  }

  /* ======== MAIN LOOP ======== */
  let last = performance.now();
  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    if (state.running) {
      /* --- controlled player movement --- */
      let mx = 0, mz = 0;
      if (keys["KeyW"] || keys["ArrowUp"])    mz -= 1;
      if (keys["KeyS"] || keys["ArrowDown"])  mz += 1;
      if (keys["KeyA"] || keys["ArrowLeft"])   mx -= 1;
      if (keys["KeyD"] || keys["ArrowRight"]) mx += 1;
      if (joy.active) { mx += joy.x; mz += joy.y; }
      const mlen = Math.hypot(mx, mz);

      const cud = controlled.userData;
      cud.slideCd = Math.max(0, cud.slideCd - dt);
      let speed = (runHeld || keys["ShiftLeft"] || keys["ShiftRight"]) ? 14 : 9.5;
      if (cud.slideTimer > 0) { cud.slideTimer -= dt; speed = 19; }

      if (mlen > 0.15) {
        mx /= mlen; mz /= mlen;
        controlled.position.x += mx * speed * dt;
        controlled.position.z += mz * speed * dt;
        cud.heading = Math.atan2(mx, mz);
        controlled.rotation.y = cud.heading;
      } else if (cud.slideTimer > 0) {
        controlled.position.x += Math.sin(cud.heading) * speed * dt;
        controlled.position.z += Math.cos(cud.heading) * speed * dt;
      }
      controlled.rotation.x = cud.slideTimer > 0 ? -0.7 : 0;
      clampToField(controlled);

      /* --- teammate AI --- */
      for (let i = 0; i < TEAM_SIZE; i++) {
        if (myTeam[i] === controlled) continue;
        updateTeammateAI(myTeam[i], i, dt);
      }

      /* --- CPU AI --- */
      for (let i = 0; i < TEAM_SIZE; i++) updateCpuAI(cpuTeam[i], i, dt);

      /* --- collisions: all players --- */
      for (let i = 0; i < allPlayers.length; i++) {
        for (let j = i + 1; j < allPlayers.length; j++) {
          resolvePlayerPlayer(allPlayers[i], allPlayers[j]);
        }
        resolvePlayerBall(allPlayers[i], i < TEAM_SIZE);
      }

      /* --- ball physics --- */
      ballVel.y -= 32 * dt;
      ball.position.addScaledVector(ballVel, dt);
      if (ball.position.y < BALL_R) { ball.position.y = BALL_R; ballVel.y *= -0.4; if (Math.abs(ballVel.y) < 1) ballVel.y = 0; }
      const friction = Math.pow(0.1, dt);
      ballVel.x *= friction; ballVel.z *= friction;
      ball.rotation.x += ballVel.z * dt * 0.5;
      ball.rotation.z -= ballVel.x * dt * 0.5;

      // walls
      const inGoal = Math.abs(ball.position.x) < GOAL_W / 2;
      if (ball.position.x < -HALF_W + BALL_R) { ball.position.x = -HALF_W + BALL_R; ballVel.x *= -0.55; }
      if (ball.position.x >  HALF_W - BALL_R) { ball.position.x =  HALF_W - BALL_R; ballVel.x *= -0.55; }
      if (!inGoal) {
        if (ball.position.z < -HALF_L + BALL_R) { ball.position.z = -HALF_L + BALL_R; ballVel.z *= -0.55; }
        if (ball.position.z >  HALF_L - BALL_R) { ball.position.z =  HALF_L - BALL_R; ballVel.z *= -0.55; }
      }

      if (checkGoal()) { /* handled */ }

      /* --- timer --- */
      state.time -= dt;
      if (state.time <= 0) { state.time = 0; endMatch(); }
      updateTimer();

      /* --- auto-switch: if ball very close to a teammate, switch to them --- */
      for (const p of myTeam) {
        if (p === controlled || p.userData.isGK) continue;
        if (distToBall(p) < 1.8 && distToBall(controlled) > 6) {
          controlled.userData.ring.visible = false;
          controlled = p;
          controlled.userData.ring.visible = true;
          break;
        }
      }
    }

    /* --- camera: broadcast-style, slightly behind controlled --- */
    const ch = controlled.userData.heading;
    const camH = 18, camBack = 16;
    const tx = controlled.position.x * 0.7;
    const tz = controlled.position.z + camBack;
    const ty = camH;
    camera.position.x += (tx - camera.position.x) * 0.06;
    camera.position.z += (tz - camera.position.z) * 0.06;
    camera.position.y += (ty - camera.position.y) * 0.06;
    camera.lookAt(controlled.position.x * 0.5, 1, controlled.position.z - 6);

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  function updateTimer() {
    const m = Math.floor(state.time / 60), s = Math.floor(state.time % 60);
    document.getElementById("timer").textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  /* ======== MESSAGES ======== */
  const msg = document.getElementById("msg");
  function flash(t, sub) {
    document.getElementById("msgT").textContent = t;
    document.getElementById("msgP").textContent = sub || "";
    document.getElementById("btnStart").style.display = "none";
    msg.style.display = "grid";
  }
  function hideMsg() { msg.style.display = "none"; }
  function showStart(t, sub) {
    document.getElementById("msgT").textContent = t;
    document.getElementById("msgP").textContent = sub;
    document.getElementById("btnStart").style.display = "inline-block";
    msg.style.display = "grid";
  }
  function endMatch() {
    state.running = false;
    const t = state.scoreMe > state.scoreCpu ? "🏆 ¡Ganaste!" :
              state.scoreMe < state.scoreCpu ? "😤 Perdiste" : "🤝 Empate";
    showStart(t, `${state.scoreMe} - ${state.scoreCpu}`);
    document.getElementById("btnStart").textContent = "JUGAR DE NUEVO";
  }
  function startMatch() {
    state.scoreMe = 0; state.scoreCpu = 0; state.time = MATCH_TIME;
    document.getElementById("sMe").textContent = 0;
    document.getElementById("sCpu").textContent = 0;
    resetPositions();
    updateTimer(); hideMsg();
    state.running = true;
  }
  document.getElementById("btnStart").addEventListener("click", startMatch);

  /* ======== RESIZE ======== */
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize); resize();

  /* ======== INIT ======== */
  resetPositions();
  camera.position.set(0, 18, 36);
  camera.lookAt(0, 1, 0);
  showStart("⚽ FFc · Player vs CPU", "5 vs 5 · Controla a tu equipo y mete goles");
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
